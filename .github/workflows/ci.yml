name: DOCORA CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Execute Vitest Unit & Security Suites
        run: npm test

      - name: Compile Next.js Webpack Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
